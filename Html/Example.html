<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link Targets Demo</title>
</head>
<body style="background: lightcoral; padding: 20px; font-family: sans-serif;">

    <h1>Level 1: Main Page (Red)</h1>
    <p>This is the very top window.</p>
    
    <!-- The Middle Box (Green) -->
    <iframe style="width: 100%; height: 400px; border: 4px solid black;" srcdoc="
        <body style='background: lightgreen; padding: 20px; font-family: sans-serif;'>
            <h2>Level 2: Middle Box (Green)</h2>
            <p>This is the parent frame.</p>
            
            <!-- The Inner Box (Blue) -->
            <iframe style='width: 100%; height: 220px; border: 4px solid black;' srcdoc='
                &lt;body style=&quot;background: lightblue; padding: 15px; font-family: sans-serif;&quot;&gt;
                    &lt;h3 style=&quot;margin-top:0;&quot;&gt;Level 3: Inner Box (Blue)&lt;/h3&gt;
                    
                    &lt;a href=&quot;https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg&quot; target=&quot;_blank&quot;&gt;1. _blank (Opens New Tab)&lt;/a&gt;&lt;br&gt;&lt;br&gt;
                    
                    &lt;a href=&quot;https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg&quot; target=&quot;_self&quot;&gt;2. _self (Replaces Blue Box)&lt;/a&gt;&lt;br&gt;&lt;br&gt;
                    
                    &lt;a href=&quot;https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg&quot; target=&quot;_parent&quot;&gt;3. _parent (Replaces Green Box)&lt;/a&gt;&lt;br&gt;&lt;br&gt;
                    
                    &lt;a href=&quot;https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg&quot; target=&quot;_top&quot;&gt;4. _top (Replaces Red Page)&lt;/a&gt;
                &lt;/body&gt;
            '></iframe>
            
            
        </body>
    "></iframe>
    <iframe src="https://www.example.com" width="100%" height="400" style="border:5px rgb(249, 23, 23) soild;" title="Example Website"
    ></iframe>


</body>
</html>
