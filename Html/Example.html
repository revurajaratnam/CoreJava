<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    
    <div class="max-w-7xl mx-auto p-6">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold">Inbox</h1>
            <button class="bg-blue-600 text-white px-5 py-3 rounded-lg">
                + Compose
            </button>
        </div>

        <div class="bg-white rounded-xl shadow mt-9">
            <div class="p-5 border-b">
                <input class="w-full border p-3 rounded-lg"
                    placeholder="Search emails...">
            </div>

            <div class="divide-y">
                <div class="p-5 flex gap-5 hover:bg-gray-50">
                    <div class="w-10 h-10 bg-blue-200 rounded-full flex items-center justify-center">
                        R
                    </div>

                    <div class="flex-1">
                        <h3 class="font-bold">Rahul Sharma</h3>
                        <p class="font-semibold">Project Update</p>
                        <p class="text-gray-500">
                            Here is the latest update regarding the project...
                        </p>
                    </div>
                    <span class="text-gray-500">10:30 AM</span>
                </div>

                <div class="p-5 flex gap-5 hover:bg-gray-50">
                    <div class="w-10 h-10 bg-blue-200 rounded-full flex items-center justify-center">
                        R
                    </div>

                    <div class="flex-1">
                        <h3 class="font-bold">Priya Singh</h3>
                        <p class="font-semibold">Meeting Tomorrow</p>
                        <p class="text-gray-500">
                            Don't forget about our meeting tomorrow...
                        </p>
                    </div>
                    <span class="text-gray-500">9:15 AM</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
